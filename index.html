<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Bonomo 25 anos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="PB.png">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #336e8c;
      background-image: url('fundo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      text-align: center;
      padding: 20px;
      color: #2f5d73;
    }

    .titulo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .icone {
      width: 30px;
      height: 30px;
    }

    #contador {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      padding: 30px;
      max-width: 700px;
      margin: 20px auto;
      box-shadow: 0 10px 30px rgba(245, 75, 7, 0.1);
    }

    h1 { font-size: 28px; }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #2f5d73;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #6c94a7; }

    .upload-box {
      display: block;
      width: 80%;
      margin: 20px auto;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: white;
      color: #888;
      cursor: pointer;
    }

    .upload-box:hover {
      border-color: #2f5d73;
      color: #2f5d73;
    }

    .upload-box input { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="titulo">
      <img src="2.png" class="icone">
      Pedro Bonomo
      <br> 25 anos
      <img src="3.png" class="icone">
    </h1>

    <p>
      Entre conchas, brisa e boas energias,<br>
      obrigado por compartilhar esse momento comigo!
    </p>

<div id="fotos">
  <h2>Envie suas fotos 📸</h2>
  <label class="upload-box">
    <span id="textoUpload">Escolher fotos 📸</span>
    <input type="file" id="fotoInput" accept="image/*">
  </label>
  <button onclick="enviarFoto()">Enviar para o Drive</button>
  <p id="statusFoto"></p>
</div>

<script>
  const dataFesta = new Date("2026-05-17T13:00:00");

  function atualizarContador() {
    const agora = new Date();
    const diferenca = dataFesta - agora;
    if (diferenca <= 0) {
      document.getElementById("contador").innerHTML = "🎉 A festa aconteceu!";
      return;
    }
    const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
    document.getElementById("contador").innerHTML = `${dias} dias • ${horas}h ${minutos}min para as lembranças`;
  }
  setInterval(atualizarContador, 1000);
  atualizarContador();

  async function enviarFoto() {
    const fileInput = document.getElementById("fotoInput");
    const file = fileInput.files[0];
    if (!file) { alert("Escolha uma foto primeiro!"); return; }

    document.getElementById("statusFoto").innerText = "Enviando para o Drive... aguarde.";

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async function() {
      const base64Data = reader.result.split(",")[1];
      
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyXKQEKPmSds9DAaLwY6WVaat9AysixD2rcnhE7dkFjrWiTKAG1AqPJEeFlL324L47d/exec", {
          method: "POST",
          body: JSON.stringify({
            data: base64Data,
            mimetype: file.type,
            filename: file.name
          })
        });

        if (response.ok) {
          document.getElementById("statusFoto").innerText = "Foto enviada com sucesso! 🎉";
          fileInput.value = "";
          document.getElementById("textoUpload").innerText = "Escolher fotos 📸";
        } else {
          document.getElementById("statusFoto").innerText = "Erro ao enviar. Tente novamente.";
        }
      } catch (error) {
        document.getElementById("statusFoto").innerText = "Erro na conexão.";
        console.error(error);
      }
    };
  }

  document.getElementById("fotoInput").addEventListener("change", function() {
    const nomeArquivo = this.files.length > 0 ? this.files[0].name : "Escolher fotos 📸";
    document.getElementById("textoUpload").innerText = nomeArquivo;
  });
</script>

  <script>
    const dataFesta = new Date("2026-05-17T13:00:00");

    function atualizarContador() {
      const agora = new Date();
      const diferenca = dataFesta - agora;

      if (diferenca <= 0) {
        document.getElementById("contador").innerHTML = "🎉 A festa aconteceu!";
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
      document.getElementById("contador").innerHTML = `${dias} dias • ${horas}h ${minutos}min para as lembranças`;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();

    async function enviarFoto() {
      const files = document.getElementById("fotoInput").files;
      if (files.length === 0) {
        alert("Escolha pelo menos uma foto!");
        return;
      }

      document.getElementById("statusFoto").innerText = "Enviando, aguarde...";

      for (let file of files) {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "fotos_25_anos");

        await fetch("https://api.cloudinary.com/v1_1/dcipfykel/image/upload", {
          method: "POST",
          body: formData
        });
      }

      document.getElementById("statusFoto").innerText = "Fotos enviadas com sucesso! 🎉";
      document.getElementById("fotoInput").value = "";
      document.getElementById("textoUpload").innerText = "Escolher fotos 📸";
    }

    document.getElementById("fotoInput").addEventListener("change", function() {
      const qtd = this.files.length;
      document.getElementById("textoUpload").innerText = qtd > 1 ? `${qtd} fotos selecionadas` : this.files[0].name;
    });
  </script>
</body>
</html>
