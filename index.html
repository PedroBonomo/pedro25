<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Bonomo 25 anos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="PB.png">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #336e8c;
      background-image: url('fundo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      text-align: center;
      padding: 20px;
      color: #2f5d73;
    }

    .titulo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .icone {
      width: 30px;
      height: 30px;
    }

    #contador {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      padding: 30px;
      max-width: 700px;
      margin: 20px auto;
      box-shadow: 0 10px 30px rgba(245, 75, 7, 0.1);
    }

    h1 { font-size: 28px; }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #2f5d73;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #6c94a7; }

    .upload-box {
      display: block;
      width: 80%;
      margin: 20px auto;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: white;
      color: #888;
      cursor: pointer;
    }

    .upload-box:hover {
      border-color: #2f5d73;
      color: #2f5d73;
    }

    .upload-box input { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="titulo">
      <img src="2.png" class="icone">
      Pedro Bonomo
      <br> 25 anos
      <img src="3.png" class="icone">
    </h1>

    <h2 id="contador"></h2>

    <p>
      Entre conchas, brisa e boas energias,<br>
      obrigado por compartilhar esse momento comigo!
    </p>

    <div id="fotos">
      <h2>Envie suas fotos 📸</h2>
      
      <label class="upload-box">
        <span id="textoUpload">Escolher fotos 📸</span>
        <input type="file" id="fotoInput" multiple>
      </label>

      <button onclick="enviarFoto()">Enviar fotos</button>
      <p id="statusFoto"></p>
    </div>
  </div>

  <div class="container">
    <h3>Local da festa 📍</h3>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3678.674452553259!2d-43.286794199999996!3d-22.777459699999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x997b145b834baf%3A0x64ff31b4d31fdfe0!2zRXNwYcOnbyBNYW5zw6Nv!5e0!3m2!1spt-BR!2sbr!4v1776272783970!5m2!1spt-BR!2sbr"
      width="90%"
      height="300"
      style="border:0; border-radius:15px;"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>

  <script>
    const dataFesta = new Date("2026-05-17T13:00:00");

    function atualizarContador() {
      const agora = new Date();
      const diferenca = dataFesta - agora;

      if (diferenca <= 0) {
        document.getElementById("contador").innerHTML = "🎉 A festa aconteceu!";
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
      document.getElementById("contador").innerHTML = `${dias} dias • ${horas}h ${minutos}min para as lembranças`;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();

    async function enviarFoto() {
      const files = document.getElementById("fotoInput").files;
      if (files.length === 0) {
        alert("Escolha pelo menos uma foto!");
        return;
      }

      document.getElementById("statusFoto").innerText = "Enviando, aguarde...";

      for (let file of files) {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "fotos_25_anos");

        await fetch("https://api.cloudinary.com/v1_1/dcipfykel/image/upload", {
          method: "POST",
          body: formData
        });
      }

      document.getElementById("statusFoto").innerText = "Fotos enviadas com sucesso! 🎉";
      document.getElementById("fotoInput").value = "";
      document.getElementById("textoUpload").innerText = "Escolher fotos 📸";
    }

    document.getElementById("fotoInput").addEventListener("change", function() {
      const qtd = this.files.length;
      document.getElementById("textoUpload").innerText = qtd > 1 ? `${qtd} fotos selecionadas` : this.files[0].name;
    });
  </script>
</body>
</html>
