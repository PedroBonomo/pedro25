<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Bonomo 25 anos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="PB.png">
  <style>
    /* ... Seus estilos permanecem iguais ... */
    body { font-family: 'Segoe UI', sans-serif; background-color: #336e8c; background-image: url('fundo.png'); background-repeat: no-repeat; background-position: center; background-size: cover; text-align: center; padding: 20px; color: #2f5d73; }
    .titulo { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .icone { width: 30px; height: 30px; }
    #contador { font-size: 22px; font-weight: bold; margin-top: 10px; }
    .container { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border-radius: 15px; padding: 30px; max-width: 700px; margin: auto; box-shadow: 0 10px 30px rgba(245, 75, 7, 0.1); }
    h1 { font-size: 28px; }
    input { width: 80%; padding: 12px; margin-top: 20px; border-radius: 10px; border: 1px solid #ccc; }
    button { margin-top: 20px; padding: 12px 25px; border: none; border-radius: 10px; background: #2f5d73; color: white; font-size: 16px; cursor: pointer; }
    .item { background: #ffffff; padding: 12px; border-radius: 10px; width: 90%; margin: 8px auto; display: flex; align-items: center; justify-content: flex-start; gap: 10px; font-size: 16px; cursor: pointer; }
    .item.confirmado { background: #e6f7ec; border: 1px solid #4CAF50; }
    .item.confirmado span::after { content: " ✓"; color: #4CAF50; font-weight: bold; }
    .upload-box { display: block; width: 80%; margin: 20px auto; padding: 12px; border-radius: 10px; border: 1px solid #ccc; background: white; color: #888; cursor: pointer; }
    .upload-box input { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="titulo">
      <img src="2.png" class="icone">
      Pedro Bonomo <br> 25 anos
      <img src="3.png" class="icone">
    </h1>

    <h2 id="contador"></h2>

    <p>Entre conchas, brisa e boas energias,<br>você está convidado para celebrar comigo meus 25 anos.</p>

    <div id="rsvp">
      <h2>Confirme sua presença 🌊</h2>
      <input type="text" id="nome" placeholder="Digite seu nome">
      <button onclick="buscar()">Buscar</button>

      <div class="lista" id="resultado"></div>

      <div id="areaConvidadoEspecial" style="display:none; margin-top: 20px; border-top: 2px dashed #2f5d73; padding-top: 15px;">
        <p>✨ <strong>Tripulação Extra:</strong> Adicione seus acompanhantes aqui:</p>
        <input type="text" id="nomeAmigo" placeholder="Nome do acompanhante" style="width: 70%;">
        <button onclick="adicionarAmigo()">+ Adicionar</button>
      </div>

      <br>
      <button onclick="confirmar()" style="background: #4CAF50;">Confirmar presença</button>
    </div>
  </div>

  <br>

  <div class="container">
    <h3>Local da festa 📍</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3674.3312!2d-43.1234!3d-22.9068!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjLCsDU0JzI0LjUiUyA0M8KwMDcnMjQuMiJX!5e0!3m2!1spt-BR!2sbr!4v1620000000000" width="90%" height="300" style="border:0; border-radius:15px;" allowfullscreen="" loading="lazy"></iframe>
  </div>

  <script>
    const dataFesta = new Date("2026-05-17T13:00:00");
    const API_URL = "https://sheetdb.io/api/v1/pxwqzzfavb1vw";
    let grupoAtual = [];

    // Contador
    function atualizarContador() {
      const agora = new Date();
      const diferenca = dataFesta - agora;
      if (diferenca <= 0) {
        document.getElementById("contador").innerHTML = "🎉 É hoje!";
        return;
      }
      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
      const segundos = Math.floor((diferenca / 1000) % 60);
      document.getElementById("contador").innerHTML = `${dias} dias • ${horas}h ${minutos}min ${segundos}s`;
    }
    setInterval(atualizarContador, 1000);

    // FUNÇÃO BUSCAR
    async function buscar() {
      const nomeBusca = document.getElementById("nome").value.toLowerCase().trim();
      if (!nomeBusca) return alert("Digite um nome!");

      document.getElementById("resultado").innerHTML = "Buscando tripulação... ⚓";

      const res = await fetch(API_URL);
      const dados = await res.json();

      const pessoa = dados.find(p => p.nome.toLowerCase().includes(nomeBusca));

      if (!pessoa) {
        document.getElementById("resultado").innerHTML = "Nome não encontrado 😢";
        document.getElementById("areaConvidadoEspecial").style.display = "none";
        return;
      }

      // Lógica do Convidado Especial (Felipe)
      if (pessoa.nome.toLowerCase().includes("felipe")) {
        document.getElementById("areaConvidadoEspecial").style.display = "block";
      } else {
        document.getElementById("areaConvidadoEspecial").style.display = "none";
      }

      const familiaId = pessoa.familia_id;
      grupoAtual = dados.filter(p => p.familia_id === familiaId);

      renderizarLista();
    }

    // Renderiza a lista de nomes e confirmados
    function renderizarLista() {
      let html = "<h3 style='margin-top:20px;'>Quem vai?</h3>";
      
      grupoAtual.forEach((p, i) => {
        const checked = p.confirmado === "sim" ? "checked" : "";
        const classe = p.confirmado === "sim" ? "confirmado" : "";
        html += `
          <label class="item ${classe}">
            <input type="checkbox" id="p${i}" ${checked}>
            <span>${p.nome}</span>
          </label>
        `;
      });

      const confirmados = grupoAtual.filter(p => p.confirmado === "sim").map(p => p.nome);
      if (confirmados.length > 0) {
        html += `<p style="margin-top:15px; font-size:14px; color: #4CAF50;">✅ Já confirmados: ${confirmados.join(", ")}</p>`;
      }

      document.getElementById("resultado").innerHTML = html;
    }

    // Adicionar amigo (Só para o Felipe)
    async function adicionarAmigo() {
      const nomeAmigo = document.getElementById("nomeAmigo").value.trim();
      if (!nomeAmigo) return alert("Digite o nome do amigo!");

      const familiaId = grupoAtual[0].familia_id;
      
      alert("Adicionando amigo, aguarde...");

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          data: [{
            nome: nomeAmigo,
            familia_id: familiaId,
            confirmado: "sim"
          }]
        })
      });

      document.getElementById("nomeAmigo").value = "";
      buscar(); // Recarrega a lista para o amigo aparecer
    }

    // Confirmar Presença
    async function confirmar() {
      if (grupoAtual.length === 0) return alert("Busque seu nome primeiro!");

      let atualizacoes = [];
      let alguemSelecionado = false;

      grupoAtual.forEach((p, i) => {
        const marcado = document.getElementById(`p${i}`).checked;
        if (marcado) alguemSelecionado = true;
        atualizacoes.push({ nome: p.nome, confirmado: marcado ? "sim" : "nao" });
      });

      if (!alguemSelecionado) {
        alert("⚠️ Marque pelo menos uma pessoa que vai à festa!");
        return;
      }

      document.getElementById("resultado").innerHTML = "Sincronizando com o mar... 🌊";

      for (let p of atualizacoes) {
        await fetch(`${API_URL}/nome/${encodeURIComponent(p.nome)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data: { confirmado: p.confirmado } })
        });
      }

      alert("Presença confirmada com sucesso! 🎉");
      buscar(); // Atualiza a visualização
    }
  </script>
</body>
</html>
