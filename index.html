<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Bonomo 25 anos</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #336e8c; text-align: center; padding: 20px; color: #2f5d73; }
    .container { background: rgba(255, 255, 255, 0.85); border-radius: 15px; padding: 30px; max-width: 700px; margin: 20px auto; }
    button { margin-top: 20px; padding: 12px 25px; border: none; border-radius: 10px; background: #2f5d73; color: white; cursor: pointer; font-weight: bold; }
    .upload-box { display: block; width: 80%; margin: 20px auto; padding: 12px; border-radius: 10px; border: 1px solid #ccc; background: white; cursor: pointer; }
    .upload-box input { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1>Pedro Bonomo - 25 anos</h1>
    <p>Obrigado por compartilhar esse momento comigo!</p>

    <div id="fotos">
      <h2>Envie sua foto 📸</h2>
      <label class="upload-box">
        <span id="textoUpload">Escolher foto 📸</span>
        <input type="file" id="fotoInput" accept="image/*">
      </label>
      <button onclick="enviarFoto()">Enviar para o Drive</button>
      <p id="statusFoto"></p>
    </div>
  </div>

  <script>
    async function enviarFoto() {
      const fileInput = document.getElementById("fotoInput");
      const file = fileInput.files[0];
      const status = document.getElementById("statusFoto");

      if (!file) { alert("Escolha uma foto primeiro!"); return; }

      status.innerText = "Enviando para o Drive... aguarde.";

      const reader = new FileReader();
      reader.readAsDataURL(file);
      
      reader.onload = async function() {
        const base64Data = reader.result.split(",")[1];
        
        try {
          const response = await fetch("https://script.google.com/macros/s/AKfycbweHAExxA_n99ORjOqe1srZ3tZQahrvenq1mfrOib_XFgrSR7mkJ3TsR-k__oC4-z-r/exec", {
            method: "POST",
            body: JSON.stringify({
              data: base64Data,
              mimetype: file.type,
              filename: file.name
            })
          });

          if (response.ok) {
            status.innerText = "Foto enviada com sucesso! 🎉";
            fileInput.value = "";
            document.getElementById("textoUpload").innerText = "Escolher foto 📸";
          } else {
            status.innerText = "Erro ao enviar. Verifique o Script.";
          }
        } catch (error) {
          status.innerText = "Erro na conexão. Verifique se o script foi implantado como 'Qualquer pessoa'.";
          console.error(error);
        }
      };
    }

    document.getElementById("fotoInput").addEventListener("change", function() {
      document.getElementById("textoUpload").innerText = this.files[0] ? this.files[0].name : "Escolher foto 📸";
    });
  </script>
</body>
</html>
